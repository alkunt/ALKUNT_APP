<svg viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="مدار" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="mdr1-tile" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#16295C"/><stop offset="1" stop-color="#070E22"/></linearGradient>
  <radialGradient id="mdr1-tileGlow" cx=".5" cy=".52" r=".5"><stop offset="0" stop-color="#2F7BFF" stop-opacity=".42"/><stop offset="1" stop-color="#2F7BFF" stop-opacity="0"/></radialGradient>
  <linearGradient id="mdr1-bevel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".1"/><stop offset=".35" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
  <radialGradient id="mdr1-orb" cx=".36" cy=".3" r=".78">
    <stop offset="0" stop-color="#F2FDFF"/><stop offset=".16" stop-color="#8AE8FF"/><stop offset=".46" stop-color="#2F9BFF"/>
    <stop offset=".8" stop-color="#1C4BD6"/><stop offset="1" stop-color="#0B2470"/>
  </radialGradient>
